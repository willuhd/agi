[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "schoolmap"
version = "1.0.0"
description = "Metric 3-D space model of the school building and a room-to-room walking-time engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
build = ["numpy>=1.21", "scipy>=1.8", "opencv-python>=4.6", "matplotlib>=3.5", "pyyaml>=6.0"]

[project.scripts]
schoolmap = "schoolmap.__main__:main"

[tool.setuptools]
packages = ["schoolmap"]

[tool.setuptools.package-data]
schoolmap = ["data/*.json", "data/*.yaml", "data/*.html", "viewer_template.html"]
