<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Space Model</title>
<style>
  :root {
    --bg1: #eef2f7; --bg2: #dde4ee; --panel: rgba(255,255,255,.92); --ink: #1f2430; --muted: #5d6677;
    --line: #d9dee7; --accent: #ff5a1f; --accent2: #7a4fd0; --ok: #1f9d55; --chip: #f2f4f8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Inter", "Segoe UI", system-ui, sans-serif; color: var(--ink);
    background: radial-gradient(ellipse at 30% 20%, var(--bg1), var(--bg2)); overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #panel { position: absolute; top: 16px; left: 16px; width: 340px; max-height: calc(100% - 32px); overflow: auto;
    background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(20,30,50,.12); padding: 16px 16px 12px; z-index: 5; }
  h1 { font-size: 16px; margin: 0 0 2px; letter-spacing: .2px; }
  .sub { font-size: 11.5px; color: var(--muted); margin-bottom: 12px; }
  label.f { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 10px 0 4px; }
  select, button { font: inherit; font-size: 13px; }
  select { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; color: var(--ink); }
  button:hover { border-color: #b7c0cf; }
  button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  #swap { flex: 0 0 34px; padding: 6px 0; }
  .card { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #fff; }
  .big { font-size: 34px; font-weight: 700; letter-spacing: -.5px; line-height: 1; }
  .big small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 12.5px; margin-top: 10px; }
  .kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  ol.legs { margin: 10px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.55; }
  ol.legs li::marker { color: var(--muted); }
  .tag { display: inline-block; padding: 0 6px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #fff; background: var(--accent2); }
  .floors { display: flex; flex-wrap: wrap; gap: 6px; }
  .floors button { flex: 0 0 auto; min-width: 44px; padding: 5px 8px; }
  input[type=range] { width: 100%; accent-color: var(--ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 11px; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.2); }
  #tip { position: absolute; pointer-events: none; z-index: 6; background: rgba(31,36,48,.92); color: #fff; font-size: 12px;
    padding: 6px 9px; border-radius: 8px; transform: translate(12px, 12px); display: none; white-space: nowrap; }
  .lbl { font-size: 10.5px; font-weight: 700; color: #1f2430; background: rgba(255,255,255,.78); padding: 1px 5px;
    border-radius: 5px; pointer-events: none; white-space: nowrap; }
  .stag { font-size: 10px; font-weight: 800; color: #fff; background: #6d48c9; padding: 1px 5px; border-radius: 5px; pointer-events: none; }
  .stag.lift { background: #d0613a; }
  .flbl { font-size: 18px; font-weight: 800; color: #1f2430; opacity: .8; pointer-events: none; }
  #help { position: absolute; right: 16px; bottom: 14px; font-size: 11px; color: var(--muted); z-index: 5;
    background: rgba(255,255,255,.7); padding: 6px 10px; border-radius: 8px; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  @media (max-width: 640px) { #panel { width: auto; right: 16px; max-height: 46%; } #help { display: none; } }
</style>

    <button id="vtop">Plan view</button>
  </div>
  <div class="legend" id="legend"></div>
</div>

sp.oninput = () => { state.speed = +sp.value; spv.textContent = `(${state.speed.toFixed(2)} m/s)`; drawRoute(); };
const eb = document.getElementById("elev");
eb.onclick = () => { state.elev = !state.elev; eb.textContent = `Lifts: ${state.elev ? "on" : "off"}`; eb.classList.toggle("on", state.elev); drawRoute(); };
const lb = document.getElementById("labels");
lb.onclick = () => { state.labels = !state.labels; lb.classList.toggle("on", state.labels); updateLabels(); };
const fwrap = document.getElementById("floors");
for (const f of [...floors].reverse()) {
  const b = document.createElement("button"); b.textContent = f.id; b.className = "on";
  b.onclick = (e) => {
    if (e.shiftKey || e.altKey) { floors.forEach(x => state.visible[x.id] = x.id === f.id); [...fwrap.children].forEach(c => c.classList.toggle("on", c === b)); }
    else { state.visible[f.id] = !state.visible[f.id]; b.classList.toggle("on", state.visible[f.id]); }
    layout();
  };
  b.title = "click: toggle · shift-click: show only this floor";
  fwrap.appendChild(b);
}
document.getElementById("explode").oninput = (e) => { state.explode = +e.target.value; layout(); };
document.getElementById("legend").innerHTML = Object.entries(KIND).filter(([k]) => k !== "room")
  .map(([, [c, n]]) => `<span><i style="background:${c}"></i>${n}</span>`).join("") +
  `<span><i style="background:#8f6ad8"></i>Stair</span><span><i style="background:#d0613a;opacity:.6"></i>Lift</span>`;
document.getElementById("subtitle").textContent =
  `${floors.length} levels · ${Object.keys(rooms).length} rooms · ${W.toFixed(1)} × ${H.toFixed(0)} m · stairs ${M.timing.stair_up_s_per_floor}s up / ${M.timing.stair_down_s_per_floor}s down per floor`;

function setView(top) {
  document.getElementById("v3d").classList.toggle("on", !top); document.getElementById("vtop").classList.toggle("on", top);
  const cy = (floors.at(-1).level * FH * state.explode) / 2;
  const panelShift = innerWidth > 640 ? -W * 0.32 : 0;           // keep the model clear of the side panel
  controls.target.set(W / 2 + panelShift, top ? 0 : cy, H / 2);
  if (top) camera.position.set(W / 2 + panelShift, 130, H / 2 + 0.01); else camera.position.set(W * 2.3 + panelShift, cy + 62, H * 2.0);
  controls.update();
}
document.getElementById("v3d").onclick = () => setView(false);
document.getElementById("vtop").onclick = () => setView(true);

// picking & hover
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = document.getElementById("tip");
function pick(ev) {
  mouse.set((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(pickables.filter(m => m.parent.visible), false)[0];
  return hit ? hit.object.userData.room : null;
}
let downAt = null;
renderer.domElement.addEventListener("pointerdown", e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  const id = pick(e); if (!id) return;
  if (e.shiftKey) { state.to = id; toSel.value = id; } else { state.from = id; fromSel.value = id; }
  drawRoute(); updateLabels();
});
renderer.domElement.addEventListener("pointermove", e => {
  const id = pick(e);
  if (!id) { tip.style.display = "none"; return; }
  const r = rooms[id]; tip.style.display = "block"; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px";
  tip.innerHTML = `<b>${r.id}</b> ${r.name !== r.id ? "· " + r.name : ""}<br><span style="opacity:.75">${r.floor} · ${r.kind} · ${r.area_m2} m²</span>`;
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelR.setSize(innerWidth, innerHeight);
});

layout(); setView(false);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); labelR.render(scene, camera); });
window.__route = (a, b) => { const R = route(a, b); return R && R.total; };   // for automated checks
window.__view = (pos, target, visible) => {                                       // scripted camera / floors
  if (visible) { floors.forEach(f => state.visible[f.id] = visible.includes(f.id)); [...fwrap.children].forEach(b => b.classList.toggle("on", state.visible[b.textContent])); layout(); }
  camera.position.set(...pos); controls.target.set(...target); controls.update();
};
</script>
</body>
</html>
