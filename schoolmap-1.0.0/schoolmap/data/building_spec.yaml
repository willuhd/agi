# =====================================================================================
#  Hand-authored building specification (the ONLY manually digitised input).
#  Everything else (walls, room polygons, walking routes, travel-time matrix, renders)
#  is derived deterministically from this file + the six floor-plan photos.
#
#  Coordinate frame (metres): origin = NW corner of the building envelope,
#  x -> east (0 .. 39.475), y -> south (0 .. 50.0).  "Up" on the plans is north.
# =====================================================================================

meta:
  name: "Hypothetical High School - main building"
  envelope_ns_m: 50.0          # given: max top-to-bottom extent of the floor plans
  # E-W extent is NOT given; it is measured from the photos: metric rectification of all six
  # photos gives envelope aspect W/H = 0.773 .. 0.811 (median 0.7895) -> 39.475 m.
  envelope_aspect: 0.7895
  floor_to_floor_m: 4.5        # visualisation only (does not affect travel times)

timing:
  walk_speed_mps: 1.2          # casual indoor walking speed (Fruin / Weidmann: 1.2-1.35 m/s)
  stair_up_s_per_floor: 15.0   # given
  stair_down_s_per_floor: 10.0 # given
  elevator:
    enabled: false             # students normally take stairs; switch on for accessibility runs
    wait_s: 25.0
    per_floor_s: 3.0
    door_s: 6.0

routing:
  grid_m: 0.10                 # routing raster resolution
  comfort_clearance_m: 0.55    # people keep ~0.5 m from walls; closer costs more
  min_clearance_m: 0.18        # hard limit (narrowest door passable ~0.6 m)
  wall_penalty: 1.5            # cost multiplier strength inside the comfort band

# Photo calibration: approximate outer-wall segments in ORIGINAL photo pixels.
# They are snapped to the drawn wall centre-line (sub-pixel) at build time; the four
# wall lines are intersected into the envelope corners NW/NE/SE/SW which are mapped to
# (0,0) (W,0) (W,H) (0,H).
calibration:
  1F: {N: [[560, 280], [180, 280]], W: [[173, 290], [200, 1170]], S: [[225, 1397], [850, 1425]], E: [[1135, 505], [1098, 1290]]}
  2F: {N: [[365, 511], [748, 513]], W: [[359, 520], [388, 1108]], S: [[395, 1114], [730, 1121]], E: [[883, 632], [867, 1042]]}
  3F: {N: [[380, 472], [770, 470]], W: [[265, 505], [318, 1222]], S: [[325, 1229], [748, 1255]], E: [[950, 628], [922, 1162]]}
  4F: {N: [[452, 504], [772, 504]], W: [[350, 532], [381, 1135]], S: [[388, 1141], [750, 1150]], E: [[921, 634], [899, 1086]]}
  B1: {N: [[260, 275], [1130, 277]], W: [[253, 282], [300, 1262]], S: [[308, 1271], [1058, 1300]], E: [[1135, 284], [1064, 1294]]}
  B2: {N: [[172, 303], [1084, 325]], W: [[165, 310], [240, 1306]], S: [[248, 1314], [998, 1356]], E: [[1090, 332], [1004, 1349]]}

