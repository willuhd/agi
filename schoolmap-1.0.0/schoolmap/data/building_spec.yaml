# -------------------------------------------------------------------------------------
# Vertical connectors.
#   plan     shaft rectangle [x0, y0, x1, y1] - the SAME on every floor (stairwells are vertical);
#            it is blocked for walking and drawn as treads / lift car.
#   shape    dogleg (two flights + half-landing) | straight | spiral | lift
#   floors   bottom -> top; landing = corridor point where the stair/lift is entered on that floor.
#   block    (optional, per floor) walking obstacle if different from plan.
# Exterior escape stairs (2F north-east, 1F west & south, basement south-east exit) are not
# part of the internal circulation and are deliberately omitted.  The 3F atrium stair drawn
# inside the void has no landing on the 2F plan, so it is not modelled.
# -------------------------------------------------------------------------------------
connectors:
  - id: S1
    name: North core stair
    story: Main stair beside the lifts; the only stair that serves every level (B2-4F).
    type: stair
    shape: dogleg
    plan: [14.6, 0.6, 19.8, 3.2]
    floors:
      B2: {landing: [19.4, 6.6]}
      B1: {landing: [19.4, 6.6]}
      1F: {landing: [19.4, 6.4]}
      2F: {landing: [19.4, 6.6]}
