# Demand -> courses join. Maps simulator labels to courses.toml keys.
# Anything unmapped (e.g. G9/G10 core, load-silent) flows through as
# unknown-load sections: reported, never placed, never invented.

# All-take core per grade: every student takes these (cohort = homeroom).
[core.G9]
cohort_pool = "homeroom"
courses = []  # G9 core loads n/s in catalog — sections reported unknown

[core.G10]
cohort_pool = "homeroom"
courses = []

# G11-AP core: English + Chinese only (true all-take). Sciences come ONLY
# from M1 choices (level-specific) — counting both double-books the cohort.
[core.G11AP]
cohort_pool = "homeroom"
courses = ["OBS AP English Language and Composition", "OBS Chinese"]

# Module-choice label -> {course key, dept for teacher matching}.
# Label missing here = unknown-load section (reported, not placed).
[modules."AP Physics 1"]
course = "OBS AP Physics 1"
dept = "physics"

