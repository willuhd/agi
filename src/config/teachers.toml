# Teacher preference profile (SOFT — feeds gamma_i / L_i, never hard vetoes).
# Hard constraints live in selection.toml + formulation feasible set.
# The optimizer wants preferences, not verdicts: every term below is a
# priced soft cost the solver may buy its way out of.

[load]
# Weekly teaching periods. ASSUMPTION — calibrate vs staffing roster.
target_periods = 20
min_periods = 12
max_periods = 28
# Price of deviating from target, per period. Overload is soft-compensated
# (links to teacher_archetypes.extra_pay in population.toml); underload
# wastes staffing budget and unbalances colleagues.
overload_price = 1.0
underload_price = 1.5

[travel]
# Aversion to weekly walking seconds between consecutive commitments.
# Priced linearly into L_i; the reachability hard cap stays in tau.
price_per_second = 0.02
# Co-location: teacher's office SHOULD sit where they predominantly teach.
# Mismatch is penalized per floor of distance between office floor and
# predominant teaching floor.
colocation_price_per_floor = 0.5

# Fatigue: teaching more than max_consecutive back-to-back periods in a day
# exhausts. Priced per period beyond the cap (soft); the solver ALSO takes
# max_consecutive as a HARD cap (no teacher works maxc+1 in a row).
[fatigue]
price_per_extra_consecutive = 1.5

[homeroom]
# Homeroom duty pins the teacher's office — HARD pin, no optimizer override.
# Grade offices: G9 -> 406 (4F), G10 -> 210 (2F), G11 -> 110 (1F).
pins = { G9 = "406", G10 = "210", G11 = "110" }
# Homeroom teachers additionally teach; their classroom load may sit anywhere.
homeroom_duty_periods = 5

[dept_offices]
# Default (non-homeroom) office by department. Rationale: sit departments
# near their predominant teaching floors (sciences <-> B2 labs via 3F,
# humanities <-> 3F teaching rooms, homeroom grades keep their floors).
math = "313"
english = "314"
physics = "320"
chemistry = "320"
biology = "313"
econ = "314"
humanities = "314"
language = "117"
arts = "407"
pe = "407"
cs = "313"

[edge_cases.ib_only_g11_homeroom]
# A G11 homeroom teacher whose ENTIRE teaching load is IB (XMT building)
# is STILL pinned to office 110 in ZX 1F — homeroom offices cannot move.
# The optimizer must NOT re-office them; it absorbs the cross-building cost
# and should respond by day-clustering their XMT lessons (fewer crossings),
# trading off against churn and colleague fairness. This is the canonical
# test that soft preference beats hard assignment.
office = "110"
teaching_zone = "XMT"
response = "day-cluster, never re-office"
