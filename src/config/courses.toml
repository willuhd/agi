# Course contact loads for scheduling. READ THIS FIRST:
# - .gpa "weight" (6.0 AP / 4.5 school) is a GPA CREDIT multiplier. It prices
#   grade points. It is NOT time. It appears NOWHERE in this file.
# - Catalog prose states contact time for ~16 entries only (Econ/Business/
#   Psych/WorldLang chapters + G9 M2/M3 forms). Everything else is n/s.
# - apschedule.png gives OBSERVED weekly slots (two-week mean) for 10 courses
#   of one G11-AP student. Observed slots and catalog periods disagree
#   (Macro: 3.5 observed vs 4.5 catalog) — both recorded, neither derived.
# - Units are kept EXACTLY as stated. credit-hr =/= teaching-period =/= slot
#   until the registrar says otherwise. No conversions anywhere in code.
# load = number or null (n/s). NEVER invent a number.

[schema]
fields = ["load", "unit", "track", "level", "room_kind", "parity", "source"]
units = ["periods", "teaching_periods", "credit_hr", "slots_observed"]
room_kinds = ["classroom", "lab", "arts", "sport"]

