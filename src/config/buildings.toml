# Buildings, zones, and travel policy.
# ZX building = "ZXB" (a.k.a. Zhong Xing, rooms zxl 1xx on 1F etc.)
# XM building = "XMT" (separate building: G11 IB + G12). Cost of crossing
# between buildings is a KNOB (cross_building_multiplier), default >> 1,
# per the assumption that XM trips dwarf any within-ZX route.

[buildings.ZXB]
name = "Zhong Xing Building"
schoolmap_version = "1.0.0"  # vendored sibling, NOT forked into src/
floors = ["1F", "2F", "3F", "4F", "B1", "B2"]
# room inventory + travel matrices produced by schoolmap-1.0.0
rooms_csv = "schoolmap-1.0.0/output/rooms.csv"
travel_matrix_csv = "schoolmap-1.0.0/output/travel_time_s.csv"

[buildings.XMT]
name = "XM Building (G11 IB + G12)"
floors = []   # no metric model yet; crossing cost handled by multiplier

# Zone policy: which track is homed in which building.
[zone_policy]
IB = "XMT"
AP = "ZXB"
G9 = "ZXB"
G10 = "ZXB"

[travel]
walk_speed_m_s = 1.2     # must match schoolmap default
up_seconds_per_floor = 15
down_seconds_per_floor = 10
# ZX<->XMT has no metric model (schoolmap is ZX-only): one cross-building
# leg costs multiplier * base_cross_seconds. Both ASSUMPTIONS.
base_cross_seconds = 60
# Effective tau for a cross-building leg = worst within-ZX leg * multiplier.
# Turn the knob down to simulate "IB moves into ZX" scenarios.
cross_building_multiplier = 20.0
