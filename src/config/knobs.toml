# Objective knobs for J(x). Sweep these; never hard-code them.
# See v2_repaired_formulation.md for definitions.

[weights]
alpha = 1.0    # efficiency: mean teacher loss
beta = 0.5     # overall fairness: CVaR_q(L)
beta_prime = 0.25  # between-group spread of group means
eta = 2.0      # price per unit soft-constraint slack
delta = 1.0    # expected repair cost under shocks
theta = 0.1    # churn vs last term (L1)

# Per-group fairness weights beta_g, keyed by group name in population.toml.
[weights.group]
department = 0.3
load_band = 0.3

[fairness]
quantile_q = 0.8        # CVaR tail threshold
use_range_instead_of_cvar = false  # cheap linear alternative: max-min

[robustness]
# Shock scenarios for E_xi[Delta(xi)]; probabilities must sum to 1.
[[robustness.scenario]]
name = "teacher_absence_1day"
prob = 0.4
[[robustness.scenario]]
name = "room_closure_1week"
prob = 0.3
[[robustness.scenario]]
name = "enrollment_surge_5pct"
prob = 0.3

[report]
pareto_sweep = "epsilon_cvar"  # min mean-L s.t. CVaR <= eps; sweep eps
pareto_points = 11

[stickiness]
# Movement model (observed): teachers move every period — new wave of
# students each slot, no owned classroom. Students should NOT constantly
# move. So teacher moves are free; student-cohort room changes between
# consecutive same-day periods are priced.
price_per_student_move = 0.3
teacher_move_price = 0.0

# Travel scope: distance priced only where the building model exists.
# G12 is XMT-only (no metric model) - travel DISABLED, never estimated.
[travel_scope]
grades = ["G9", "G10", "G11"]
G12_disabled_reason = "XMT building has no metric model"

# Travel pricing policy (sched pipeline). No hardcodes in code: the scorer
# reads these knobs. price_mode is reserved ("hard_zero" adopted).
[travel_pricing]
price_mode = "hard_zero"
lunch_free = true       # same-day successive pair straddling lunch costs 0
overnight_free = true   # cross-day successive assignments cost 0 (no overnight walk)
# lunch boundary itself lives in periods.toml [school] lunch_after_period; do NOT duplicate it here.
